<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT List — Document Downloader</title>
    <meta name="description" content="Search encrypted PT records in real-time">
    <link rel="stylesheet" href="/static/search.css">

    <style>
        /* Single-view full height layout with fixed search and scrollable table */
        html, body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .ptlist-page {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            padding: 16px 24px;
            gap: 14px;
            min-height: 0;
        }

        /* Fixed Top Search Bar - Non-scrollable */
        .search-top-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 14px 20px;
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .search-top-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            max-width: 650px;
        }

        .search-top-input {
            flex: 1;
            padding: 10px 16px;
            border: 1.5px solid var(--border-medium);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            color: var(--text-primary);
            background: var(--bg-primary);
            outline: none;
            transition: all var(--transition);
        }
        .search-top-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(40,44,108,0.12);
        }

        .search-top-btn {
            padding: 9px 22px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .search-top-btn:hover {
            background: var(--accent-hover);
        }

        .search-top-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.82rem;
            color: var(--text-muted);
        }
        .search-top-right strong {
            color: var(--accent);
            font-weight: 700;
        }

        /* Table Card Container - Takes remaining space, Table body is scrollable */
        .table-card-main {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .table-scroll-wrapper {
            flex: 1;
            overflow: auto;
            min-height: 0;
        }

        .table-scroll-wrapper::-webkit-scrollbar { width: 6px; height: 6px; }
        .table-scroll-wrapper::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 3px; }

        .pt-full-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.78rem;
        }

        .pt-full-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .pt-full-table th {
            background: var(--accent);
            color: #ffffff;
            font-weight: 700;
            padding: 8px 6px;
            text-align: left;
            font-size: 0.70rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: none;
        }
        .pt-full-table th:first-child { border-radius: var(--radius-sm) 0 0 0; }
        .pt-full-table th:last-child { border-radius: 0 var(--radius-sm) 0 0; }

        .pt-full-table th:nth-child(1) { width: 9%; }  /* CODE */
        .pt-full-table th:nth-child(2) { width: 9%; }  /* SUB DATE */
        .pt-full-table th:nth-child(3) { width: 22%; } /* COMPANY NAME */
        .pt-full-table th:nth-child(4) { width: 10%; } /* FE ID */
        .pt-full-table th:nth-child(5) { width: 10%; } /* PWD */
        .pt-full-table th:nth-child(6) { width: 6%; }  /* COUNTRY */
        .pt-full-table th:nth-child(7) { width: 15%; } /* EMAIL ID */
        .pt-full-table th:nth-child(8) { width: 8%; }  /* EMAIL PWD */
        .pt-full-table th:nth-child(9) { width: 11%; } /* NEW PWD */

        .pt-full-table td {
            padding: 6px 6px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.76rem;
        }

        .pt-full-table tbody tr:hover td {
            background: var(--accent-light);
        }

        .tag-code-val {
            background: #f3e8ff;
            color: #7e22ce;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.73rem;
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }
        body.dark-mode .tag-code-val {
            background: #3b0764;
            color: #c084fc;
        }

        .tag-fe-val {
            background: #eef2ff;
            color: #4f46e5;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.73rem;
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }
        body.dark-mode .tag-fe-val {
            background: #1e1b4b;
            color: #818cf8;
        }

        .tag-pwd-val {
            background: #ecfdf5;
            color: #059669;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.73rem;
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }
        body.dark-mode .tag-pwd-val {
            background: #064e3b;
            color: #34d399;
        }

        .tag-newpwd-val {
            background: #fffbeb;
            color: #d97706;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.73rem;
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }
        body.dark-mode .tag-newpwd-val {
            background: #451a03;
            color: #fbbf24;
        }

        .tag-country-val {
            background: var(--bg-primary);
            border: 1px solid var(--border-medium);
            color: var(--text-secondary);
            font-size: 0.70rem;
            font-weight: 600;
            padding: 1px 5px;
            border-radius: 4px;
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }

        .tag-email-val {
            color: #4f46e5;
            font-weight: 600;
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }
        body.dark-mode .tag-email-val {
            color: #818cf8;
        }

        .tag-emailpwd-val {
            background: #f0fdf4;
            color: #15803d;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.73rem;
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }
        body.dark-mode .tag-emailpwd-val {
            background: #14532d;
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="tricolor-ribbon"></div>

    <!-- Fixed Header matching Sponsor Search -->
    <header class="header">
        <div class="header-left">
            <h1>PT List</h1>
            <span class="badge">Decrypted Vault</span>
        </div>
        <div class="header-right">
            <a href="/" title="Go to Document Downloader">Document Downloader</a>
            <a href="/search" title="Go to Sponsor Search">Sponsor Search</a>
            <div class="sync-status" id="syncStatus">
                <span class="sync-dot synced" id="syncDot"></span>
                <span id="syncText">3-Min Sync</span>
            </div>
            <button class="dark-toggle" id="darkToggle" title="Toggle Dark Mode">🌞</button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="ptlist-page">
        <!-- Fixed Non-Scrollable Search Bar Top Panel -->
        <div class="search-top-panel">
            <div class="search-top-left">
                <input type="text" id="searchInput" class="search-top-input" placeholder="🔍 Type company name, FE ID, Code, or Email ID to search..." autofocus autocomplete="off">
                <button class="search-top-btn" id="searchBtn">Search</button>
            </div>
            <div class="search-top-right">
                <span id="resultsCount"><strong>0</strong> records found</span>
            </div>
        </div>

        <!-- Table Card: Only Table Data Body Scrolls -->
        <div class="table-card-main">
            <div class="table-scroll-wrapper">
                <table class="pt-full-table">
                    <thead>
                        <tr>
                            <th>CODE</th>
                            <th>SUB DATE</th>
                            <th>COMPANY NAME</th>
                            <th>FE ID</th>
                            <th>PWD</th>
                            <th>COUNTRY</th>
                            <th>EMAIL ID</th>
                            <th>EMAIL PWD</th>
                            <th>NEW PWD</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                        <tr>
                            <td colspan="9">
                                <div class="empty-state">
                                    <div class="icon">🔍</div>
                                    <h3>Loading Records</h3>
                                    <p>Fetching PT records from database...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const resultsBody = document.getElementById('resultsBody');
            const resultsCount = document.getElementById('resultsCount');
            const darkToggle = document.getElementById('darkToggle');

            let debounceTimer = null;

            // Dark Mode Handler
            function initTheme() {
                const saved = localStorage.getItem('theme');
                if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.body.classList.add('dark-mode');
                    darkToggle.textContent = '🌙';
                } else {
                    document.body.classList.remove('dark-mode');
                    darkToggle.textContent = '🌞';
                }
            }

            darkToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                darkToggle.textContent = isDark ? '🌙' : '🌞';
            });

            initTheme();

            // Fetch & Render Records directly in Single Main Table
            async function fetchRecords(query = '') {
                try {
                    const res = await fetch(`/ptlist/api/search?q=${encodeURIComponent(query)}`);
                    if (res.status === 401 || res.status === 403) {
                        window.location.href = '/';
                        return;
                    }
                    const data = await res.json();
                    renderTable(data.records || []);
                } catch (err) {
                    console.error('Fetch error:', err);
                    resultsBody.innerHTML = `
                        <tr>
                            <td colspan="9">
                                <div class="empty-state">
                                    <div class="icon">⚠️</div>
                                    <h3>Error Loading Records</h3>
                                    <p>Could not fetch data from database.</p>
                                </div>
                            </td>
                        </tr>
                    `;
                }
            }

            function renderTable(records) {
                resultsCount.innerHTML = `<strong>${records.length}</strong> records found`;

                if (records.length === 0) {
                    resultsBody.innerHTML = `
                        <tr>
                            <td colspan="9">
                                <div class="empty-state">
                                    <div class="icon">🔍</div>
                                    <h3>No Matching Records Found</h3>
                                    <p>Try searching for a different company, FE ID, or Code</p>
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }

                resultsBody.innerHTML = records.map(r => {
                    const rawCode = r.code || '';
                    const rawSubDate = r.sub_date || '';
                    const rawCompanyName = r.company_name || '';
                    const rawFeId = r.fe_id || '';
                    const rawPwd = r.pwd || '';
                    const rawCountry = r.country || '';
                    const rawEmailId = r.email_id || '';
                    const rawEmailPwd = r.email_pwd || '';
                    const rawNewPwd = r.new_pwd || '';

                    const code = rawCode ? `<span class="tag-code-val" title="${escapeAttr(rawCode)}">${escapeHtml(rawCode)}</span>` : '<span style="color: var(--text-muted);">—</span>';
                    const feId = rawFeId ? `<span class="tag-fe-val" title="${escapeAttr(rawFeId)}">${escapeHtml(rawFeId)}</span>` : '<span style="color: var(--text-muted);">—</span>';
                    const pwd = rawPwd ? `<span class="tag-pwd-val" title="${escapeAttr(rawPwd)}">${escapeHtml(rawPwd)}</span>` : '<span style="color: var(--text-muted);">—</span>';
                    const country = rawCountry ? `<span class="tag-country-val" title="${escapeAttr(rawCountry)}">${escapeHtml(rawCountry)}</span>` : '<span style="color: var(--text-muted);">—</span>';
                    const emailId = rawEmailId ? `<span class="tag-email-val" title="${escapeAttr(rawEmailId)}">${escapeHtml(rawEmailId)}</span>` : '<span style="color: var(--text-muted);">—</span>';
                    const emailPwd = rawEmailPwd ? `<span class="tag-emailpwd-val" title="${escapeAttr(rawEmailPwd)}">${escapeHtml(rawEmailPwd)}</span>` : '<span style="color: var(--text-muted);">—</span>';
                    const newPwd = rawNewPwd ? `<span class="tag-newpwd-val" title="${escapeAttr(rawNewPwd)}">${escapeHtml(rawNewPwd)}</span>` : '<span style="color: var(--text-muted);">—</span>';

                    return `
                        <tr>
                            <td title="${escapeAttr(rawCode)}">${code}</td>
                            <td style="font-family: monospace;" title="${escapeAttr(rawSubDate)}">${escapeHtml(rawSubDate || '—')}</td>
                            <td style="font-weight: 700; color: var(--text-primary);" title="${escapeAttr(rawCompanyName)}">${escapeHtml(rawCompanyName || '—')}</td>
                            <td title="${escapeAttr(rawFeId)}">${feId}</td>
                            <td title="${escapeAttr(rawPwd)}">${pwd}</td>
                            <td title="${escapeAttr(rawCountry)}">${country}</td>
                            <td title="${escapeAttr(rawEmailId)}">${emailId}</td>
                            <td title="${escapeAttr(rawEmailPwd)}">${emailPwd}</td>
                            <td title="${escapeAttr(rawNewPwd)}">${newPwd}</td>
                        </tr>
                    `;
                }).join('');
            }

            function escapeHtml(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function escapeAttr(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            // Search Event Listeners
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    fetchRecords(query);
                }, 200);
            });

            searchBtn.addEventListener('click', () => {
                fetchRecords(searchInput.value.trim());
            });

            // Initial load
            fetchRecords('');

            // Auto-refresh every 30 seconds
            setInterval(() => {
                fetchRecords(searchInput.value.trim());
            }, 30000);

            // ─── Allowed Emails Admin Modal Logic ─────────────────────────────
            const accessModal = document.getElementById('accessModal');
            const openAccessModalBtn = document.getElementById('openAccessModalBtn');
            const closeAccessModalBtn = document.getElementById('closeAccessModalBtn');
            const allowedEmailsList = document.getElementById('allowedEmailsList');
            const addEmailForm = document.getElementById('addEmailForm');
            const newEmailInput = document.getElementById('newEmailInput');
            const accessMsg = document.getElementById('accessMsg');

            function showAccessMsg(text, isError = false) {
                accessMsg.style.display = 'block';
                accessMsg.style.color = isError ? '#ef4444' : '#10b981';
                accessMsg.innerText = text;
                setTimeout(() => { accessMsg.style.display = 'none'; }, 4000);
            }

            async function loadAllowedEmails() {
                allowedEmailsList.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 16px;">Loading authorized people...</div>';
                try {
                    const res = await fetch('/ptlist/api/allowed-emails');
                    const data = await res.json();
                    if (data.success && data.emails) {
                        renderAllowedEmails(data.emails);
                    } else {
                        allowedEmailsList.innerHTML = '<div style="color: #ef4444; padding: 8px;">Failed to load list</div>';
                    }
                } catch (err) {
                    console.error(err);
                }
            }

            function renderAllowedEmails(emails) {
                if (emails.length === 0) {
                    allowedEmailsList.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 16px;">No authorized people found</div>';
                    return;
                }
                allowedEmailsList.innerHTML = emails.map(e => `
                    <div class="allowed-email-item">
                        <div>
                            <div style="font-weight: 600; color: var(--text-primary);">${escapeHtml(e.email)}</div>
                            <div style="font-size: 0.75rem; color: var(--text-secondary);">Added by ${escapeHtml(e.added_by || 'system')} (${escapeHtml(e.created_at || '')})</div>
                        </div>
                        <button class="btn-delete-email" onclick="deleteAllowedEmail(${e.id})">Revoke Access</button>
                    </div>
                `).join('');
            }

            openAccessModalBtn.addEventListener('click', () => {
                accessModal.classList.add('active');
                loadAllowedEmails();
            });

            closeAccessModalBtn.addEventListener('click', () => {
                accessModal.classList.remove('active');
            });

            addEmailForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = newEmailInput.value.trim();
                if (!email) return;

                try {
                    const res = await fetch('/ptlist/api/allowed-emails/add', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        newEmailInput.value = '';
                        showAccessMsg(data.message);
                        loadAllowedEmails();
                    } else {
                        showAccessMsg(data.error || 'Failed to add person', true);
                    }
                } catch (err) {
                    showAccessMsg('Network error', true);
                }
            });

            window.deleteAllowedEmail = async function (id) {
                if (!confirm('Are you sure you want to revoke PT List access for this email?')) return;
                try {
                    const res = await fetch('/ptlist/api/allowed-emails/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id })
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        showAccessMsg(data.message);
                        loadAllowedEmails();
                    } else {
                        showAccessMsg(data.error || 'Failed to revoke access', true);
                    }
                } catch (err) {
                    showAccessMsg('Network error', true);
                }
            };
        })();
    </script>
</body>
</html>
